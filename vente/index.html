<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Rayon</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rayon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --s1:#14171f; --s2:#1b1f29; --s3:#232836; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#eef1f7; --muted:#9aa3b5; --dim:#6b7488; --acc:#ffb547; --acc2:#ff8a4c; --ok:#4ade80; --bad:#f87171; --blue:#7aa7ff;
  --body:"Manrope",system-ui,-apple-system,sans-serif; --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--body)}
body{min-height:100vh; padding-bottom:calc(90px + var(--safe-b))}
button{font:inherit; color:inherit}
input{font:16px var(--body); color:var(--ink)}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* barre du haut */
.top{position:sticky; top:0; z-index:30; padding:calc(var(--safe-t) + 10px) 0 10px; background:linear-gradient(180deg, rgba(11,13,18,.98) 70%, rgba(11,13,18,.0))}
.top-row{display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:1.15rem; letter-spacing:-.02em; cursor:pointer; background:none; border:0; padding:0}
.brand i{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:grid; place-items:center; font-style:normal; color:#1a1206; font-size:.95rem}
.top-sp{flex:1}
.tbtn{display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:var(--s1); font-weight:700; font-size:.84rem; cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--acc); color:#1a1206; border-color:var(--acc)}
.search{position:relative; margin-top:10px}
.search input{width:100%; padding:14px 44px 14px 46px; border-radius:16px; border:1px solid var(--line2); background:var(--s1); outline:none}
.search input:focus{border-color:rgba(255,181,71,.6); box-shadow:0 0 0 4px rgba(255,181,71,.12)}
.search svg{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted)}
.search .clr{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:10px; border:0; background:var(--s3); cursor:pointer; color:var(--muted); font-size:1.1rem}

/* accueil */
h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:22px 2px 10px; font-weight:800}
.cats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media (min-width:700px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.cats{grid-template-columns:repeat(6,1fr)}}
.cat{all:unset; box-sizing:border-box; cursor:pointer; padding:16px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px; min-height:112px; position:relative; overflow:hidden}
.cat:active{transform:scale(.98)}
.cat:focus-visible{outline:2px solid var(--acc)}
.cat .ic{font-size:1.7rem; line-height:1}
.cat b{font-size:1.02rem; font-weight:800}
.cat small{color:var(--muted); font-weight:600; font-size:.8rem}
.cat::after{content:""; position:absolute; right:-30px; bottom:-30px; width:90px; height:90px; border-radius:50%; background:var(--cc,#ffb547); opacity:.12}
.hrow{display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px}
.hrow::-webkit-scrollbar{display:none}
.hrow .card{min-width:240px; max-width:260px}
.refl{display:flex; flex-direction:column; gap:8px}
.refl div{padding:12px 14px; border-radius:14px; background:var(--s1); border:1px solid var(--line); font-size:.92rem}
.refl div b{color:var(--acc)}

/* liste */
.ref{margin:4px 0 12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--s1);overflow:hidden}
.ref>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:10px;font-weight:800}
.ref>summary::-webkit-details-marker{display:none}
.ref>summary small{color:var(--muted);font-weight:600;margin-left:auto;font-size:.8rem}
.ref>summary:after{content:"▾";color:var(--acc);transition:transform .2s}
.ref[open]>summary:after{transform:rotate(180deg)}
.ref-b{padding:0 15px 14px}
.ref-q{margin:0 0 12px;padding:11px 13px;border-radius:12px;background:var(--s2);font-size:.92rem}
.ref-q b{display:block;color:var(--acc);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.ref-c{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;counter-reset:rc}
.ref-c li{counter-increment:rc;padding:11px 12px 11px 42px;border-radius:12px;background:var(--s2);position:relative;font-size:.88rem}
.ref-c li:before{content:counter(rc);position:absolute;left:12px;top:11px;width:21px;height:21px;border-radius:50%;background:var(--acc);color:#111;font-weight:800;font-size:.78rem;display:grid;place-items:center}
.ref-c b{display:block;font-size:.95rem;margin-bottom:4px}
.ref-c span{display:block;margin-top:3px;color:var(--muted)}
.ref-c span i{font-style:normal;color:var(--ink);font-weight:700}
.ref-p{margin:12px 0 0;padding:10px 12px;border-radius:12px;border:1px solid rgba(248,113,113,.35);color:#fecaca;font-size:.88rem}
.ref h3{font-size:.95rem;margin:16px 0 8px}
.ref-t{overflow-x:auto;margin:0 -15px;padding:0 15px}
.ref-t table{border-collapse:collapse;font-size:.82rem;min-width:100%}
.ref-t th,.ref-t td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ref-t th{color:var(--muted);font-weight:700;white-space:nowrap}
.ref-t td:first-child{font-weight:700;min-width:120px}
.ref-t td.u{color:var(--muted);min-width:180px}
.ref-t tr[data-id]{cursor:pointer}
.ref-t tr[data-id]:active td{background:var(--s3)}
.reflink{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:2px 0 10px;font-size:.85rem;color:var(--muted)}
.reflink button{border:1px solid var(--line2);background:var(--s1);border-radius:999px;padding:6px 11px;font-weight:700;font-size:.82rem}
.sh-ref{margin:-4px 0 12px;font-size:.82rem;color:var(--muted)}
.sh-ref a{color:var(--acc);font-weight:700;text-decoration:none}
.ref-u{background:rgba(255,181,71,.08);border-left:3px solid var(--acc);padding:4px 8px;border-radius:4px}.ref-pr{margin:12px 0;display:grid;gap:6px}.ref-pr>b{font-size:.9rem}.ref-pr div{display:grid;gap:2px;padding:8px 10px;border:1px solid var(--line,#2a2f3a);border-radius:8px}.ref-pr span{font-weight:700}.ref-pr small{color:var(--muted)}.ref-pr em{font-style:normal;color:var(--acc);font-weight:600}
.tst p{margin:0 0 8px;line-height:1.45}.tst-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.tst-l span{font-size:.8rem;padding:3px 8px;border-radius:999px;background:rgba(80,200,120,.12)}.tst-l.bad span{background:rgba(240,90,90,.12)}.tst small{color:var(--muted)}.tst small a{color:var(--acc)}
.sh-bar.solid{background:var(--bg)}
.jump{position:sticky;top:58px;z-index:2;display:flex;gap:5px;overflow-x:auto;padding:2px 12px 10px;border-bottom:1px solid var(--line);background:var(--bg);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:1 0 auto;border:1px solid var(--line2);background:var(--s1);color:var(--ink);border-radius:999px;padding:7px 9px;font-weight:700;font-size:.78rem;cursor:pointer}
.jump button.on{background:var(--acc);border-color:var(--acc);color:#1a1206}
.jump.inl{position:static;padding:2px 0 12px;border:0;background:none}
.sec small a{color:var(--acc);font-weight:700}
.lnb{display:flex;gap:12px;align-items:center;margin-bottom:8px}.lnb b{font-size:1.4rem;color:var(--acc);white-space:nowrap}.lng{display:block;color:var(--muted);margin-bottom:6px}
.pitch{margin:0;padding:0;list-style:none;counter-reset:pi;display:grid;gap:10px}.pitch li{counter-increment:pi;position:relative;padding:10px 12px 10px 40px;border-radius:12px;background:var(--s2)}.pitch li:before{content:counter(pi);position:absolute;left:11px;top:11px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#1a1206;font-weight:800;font-size:.75rem;display:grid;place-items:center}.pitch b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin-bottom:3px}
.co-list{display:grid;gap:8px}.co-it{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:36px 1fr;column-gap:10px;align-items:center;padding:13px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}.co-it .ic{grid-row:span 2;font-size:1.5rem}.co-it small{color:var(--muted);font-weight:600}
.co-voc{display:grid;gap:6px}.co-voc div{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--s2)}.co-voc span{color:var(--muted);font-size:.9rem}
.co-q{margin-bottom:14px}.co-q p{margin:0 0 8px}.co-o{display:grid;gap:6px}.co-o .opt{text-align:left}.co-o .opt.good{background:rgba(74,222,128,.18);border-color:var(--ok);color:var(--ink)}.co-o .opt.bad{background:rgba(248,113,113,.15);border-color:var(--bad)}.co-x{margin-top:8px!important;font-size:.9rem;color:var(--muted)}.lnk-a{color:var(--acc);font-weight:700}
.svc.rem ul{margin:6px 0 0;padding-left:18px}.svc.rem li{margin:3px 0}
.promo{margin:4px 0 12px;padding:12px 14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,181,71,.18),rgba(255,138,76,.12));border:1px solid var(--acc);font-size:.92rem}
.stage{display:flex;align-items:baseline;gap:8px;margin:26px 2px -6px;font-weight:800;font-size:1.05rem;scroll-margin-top:120px}
.stage span{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#1a1206;display:grid;place-items:center;font-size:.8rem;flex:0 0 auto;align-self:center}
.stage i{font-style:normal;color:var(--muted);font-weight:600;font-size:.82rem}
.sh-price{color:var(--acc)}
.crumb{all:unset;cursor:pointer;color:var(--acc);font-weight:700;font-size:.86rem;margin:12px 2px 0;display:inline-block}
.lhead{display:flex; align-items:baseline; gap:10px; margin:14px 2px 8px}
.lhead h1{font-size:1.4rem; margin:0; letter-spacing:-.02em}
.lhead span{color:var(--muted); font-weight:600; font-size:.88rem}
.chips{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:2px 0 8px; margin:0 -16px; padding-left:16px; padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; padding:8px 13px; border-radius:999px; border:1px solid var(--line2); background:var(--s1); font-weight:700; font-size:.84rem; cursor:pointer; white-space:nowrap}
.chip[aria-pressed="true"]{background:rgba(255,181,71,.16); border-color:var(--acc); color:#ffd89a}
.chip.sort{margin-left:auto}
.list{display:grid; grid-template-columns:1fr; gap:10px; margin-top:6px}
@media (min-width:700px){.list{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1050px){.list{grid-template-columns:repeat(3,1fr)}}
.card{all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; gap:8px; padding:14px 15px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line); position:relative}
.card:active{background:var(--s2)}
.card:focus-visible{outline:2px solid var(--acc)}
.c-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.c-brand{font-size:.74rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.c-model{font-weight:800; font-size:1.02rem; line-height:1.25}
.c-price{font-weight:800; font-size:1.15rem; white-space:nowrap; color:var(--acc)}
.c-specs{display:flex; flex-wrap:wrap; gap:5px}
.c-specs span{font-size:.74rem; font-weight:700; padding:3px 8px; border-radius:7px; background:var(--s3); color:#cfd5e2}
.c-arg{font-size:.86rem; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.c-fav{position:absolute; right:12px; bottom:10px; color:var(--acc); font-size:.9rem}
.empty{text-align:center; color:var(--muted); padding:40px 10px}
mark{background:rgba(255,181,71,.25); color:inherit; border-radius:3px; padding:0 1px}

/* fiche */
.sheet{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; overscroll-behavior:contain; animation:up .22s ease}
@keyframes up{from{transform:translateY(24px); opacity:0}to{transform:none; opacity:1}}
.sh-bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:calc(var(--safe-t) + 10px) 16px 10px; background:linear-gradient(180deg, rgba(11,13,18,.98) 75%, rgba(11,13,18,0))}
.ib{width:42px; height:42px; border-radius:13px; border:1px solid var(--line2); background:var(--s1); display:grid; place-items:center; cursor:pointer; font-size:1.15rem; flex:none}
.ib:disabled{opacity:.3}
.ib[aria-pressed="true"]{color:var(--acc); border-color:var(--acc)}
.sh-pos{flex:1; text-align:center; font-size:.8rem; color:var(--muted); font-weight:700}
.sh{max-width:880px; margin:0 auto; padding:4px 16px 120px}
.sh-cat{font-size:.78rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.sh-title{font-size:1.65rem; font-weight:800; letter-spacing:-.025em; line-height:1.15; margin:4px 0 2px}
.sh-title small{display:block; font-size:.95rem; color:var(--muted); font-weight:700; letter-spacing:0}
.sh-price{display:flex; align-items:baseline; gap:10px; margin:10px 0 4px}
.sh-price b{font-size:2.1rem; font-weight:800; color:var(--acc); letter-spacing:-.02em}
.sh-price span{font-size:.8rem; color:var(--dim)}
.sec{margin-top:18px; padding:16px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line)}
.sec h3{margin:0 0 12px; font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:800; display:flex; align-items:center; gap:8px}
.args{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; counter-reset:a}
.args li{display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:1.02rem; font-weight:600; line-height:1.35; counter-increment:a}
.args li::before{content:counter(a); width:28px; height:28px; border-radius:9px; background:rgba(255,181,71,.15); color:var(--acc); display:grid; place-items:center; font-weight:800; font-size:.85rem}
.specs{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
@media (min-width:600px){.specs{grid-template-columns:repeat(3,1fr)}}
.sp{padding:10px 12px; border-radius:12px; background:var(--s2)}
.sp small{display:block; font-size:.72rem; color:var(--muted); font-weight:700}
.sp b{font-size:1.05rem; font-weight:800}
.sp b.yes{color:var(--ok)} .sp b.no{color:var(--dim)}
.objs{display:flex; flex-direction:column; gap:8px}
.obj{padding:11px 13px; border-radius:12px; background:var(--s2); border-left:3px solid var(--acc2); font-size:.93rem}
.obj b{display:block; font-size:.86rem; color:#ffc79f; margin-bottom:2px}
.adds{display:flex; flex-wrap:wrap; gap:7px}
.adds span{padding:8px 12px; border-radius:11px; background:var(--s2); font-size:.88rem; font-weight:600}
.alts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:600px){.alts{grid-template-columns:repeat(2,1fr)}}
.alt{all:unset; box-sizing:border-box; cursor:pointer; padding:12px 14px; border-radius:14px; background:var(--s2); display:flex; flex-direction:column; gap:3px}
.alt small{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.alt b{font-weight:800} .alt em{font-style:normal; color:var(--acc); font-weight:800}
.alt:focus-visible{outline:2px solid var(--acc)}
.svc{padding:12px 14px; border-radius:12px; background:rgba(122,167,255,.08); border:1px solid rgba(122,167,255,.22); font-size:.92rem}
.svc b{color:#cfdcff}
.notes{white-space:pre-wrap; font-size:.92rem; color:#d7dce8}
.int{position:relative}
body.client .int{display:none}
body.client .sh-title{font-size:2rem}
body.client .sp b{font-size:1.25rem}
body.client .args li{font-size:1.15rem}
.client-tag{display:none; margin-left:auto; font-size:.72rem; font-weight:800; color:#1a1206; background:var(--acc); padding:3px 8px; border-radius:7px}
body.client .client-tag{display:inline-block}

/* comparateur */
.tray{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + var(--safe-b)); z-index:70; display:flex; align-items:center; gap:10px; padding:8px 8px 8px 16px; border-radius:16px; background:#262b38; border:1px solid var(--line2); box-shadow:0 18px 40px -12px rgba(0,0,0,.8); max-width:calc(100vw - 24px)}
.tray span{font-weight:700; font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tray .go{padding:10px 14px; border-radius:11px; border:0; background:var(--acc); color:#1a1206; font-weight:800; cursor:pointer}
.tray .x{width:36px; height:36px; border-radius:10px; border:0; background:var(--s3); cursor:pointer; color:var(--muted)}
.cmp{width:100%; border-collapse:separate; border-spacing:0; font-size:.92rem}
.cmp-wrap{overflow-x:auto; margin:0 -16px; padding:0 16px}
.cmp th,.cmp td{padding:10px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; min-width:130px}
.cmp th:first-child,.cmp td:first-child{position:sticky; left:0; background:var(--bg); min-width:110px; color:var(--muted); font-weight:700; font-size:.8rem; z-index:1}
.cmp thead th{font-size:.95rem; font-weight:800}
.cmp thead th small{display:block; color:var(--muted); font-size:.74rem; text-transform:uppercase}
.cmp td.best{color:var(--ok); font-weight:800}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.card .c-chk{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;font-weight:900;color:#1a1206}.card.sel .c-chk{background:var(--acc);border-color:var(--acc)}.chip.cmpm[aria-pressed="true"]{background:var(--acc);color:#1a1206;border-color:var(--acc)}
.cmp tr.sr td{position:static;background:none;color:var(--acc);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;padding:18px 2px 6px;border-bottom:1px solid var(--line2)}
.cmp.cmp3,.cmp.cmp2{table-layout:fixed}.cmp.cmp3 th,.cmp.cmp3 td{min-width:0;padding:9px 5px;font-size:.84rem;overflow-wrap:anywhere;hyphens:auto}.cmp.cmp3 th:first-child,.cmp.cmp3 td:first-child{min-width:0;width:72px}
.cmp.cmp2 th,.cmp.cmp2 td{min-width:0;overflow-wrap:anywhere}.cmp.cmp2 th:first-child,.cmp.cmp2 td:first-child{min-width:0;width:84px}
.cmp td.worse{color:var(--bad)}
.cmp .dlt{display:block;color:var(--muted);font-weight:600}
.cmp-n{all:unset;cursor:pointer;display:block;text-decoration:underline;text-decoration-color:var(--line2)}
.cmp .wins{display:inline-block;margin-top:4px;padding:1px 7px;border-radius:999px;background:rgba(74,222,128,.15);color:var(--ok);font-size:.75rem;font-weight:800;margin-right:8px}
.cmp-h{margin:20px 2px 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.verdict{display:grid;gap:6px;padding:12px 14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line2);margin-top:6px}
.same{display:flex;flex-wrap:wrap;gap:6px}.same span{padding:6px 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:.85rem}.same b{color:var(--muted);font-weight:700;margin-right:4px}
.cmp-p{margin-top:16px}.cmp-p summary{cursor:pointer;color:var(--muted);font-weight:700}
.cmp .rm{all:unset; cursor:pointer; color:var(--dim); font-size:.78rem; font-weight:700; margin-top:4px; display:inline-block}

document.addEventListener("keydown",function(e){if(!ui.open||/input|textarea/i.test(e.target.tagName))return;if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);else if(e.key==="Escape")closeSheet()});

/* ----- comparateur ----- */
function cmpToggle(id){var i=ui.cmp.indexOf(id);if(i>=0)ui.cmp.splice(i,1);else{if(ui.cmp.length>=3){toast("3 produits maximum dans le comparateur");return}ui.cmp.push(id)}ui.cmp=ui.cmp.filter(find);lsSet("rayon-cmp",ui.cmp);toast(i>=0?"Retiré du comparateur":"Ajouté au comparateur ("+ui.cmp.length+"/3)");renderTray()}
function renderTray(){ui.cmp=ui.cmp.filter(find);var n=ui.cmp.length;$("#tray").hidden=!n||(ui.open==="__cmp__");$("#tray-t").textContent=n+" à comparer : "+ui.cmp.map(function(id){return find(id).model}).join(", ");$("#tray-go").disabled=n<2;$("#tray-go").style.opacity=n<2?".5":"1"}
$("#tray-x").addEventListener("click",function(){ui.cmp=[];lsSet("rayon-cmp",ui.cmp);renderTray();if(ui.open&&ui.open!=="__cmp__")openSheet(ui.open,null,true)});
$("#tray-go").addEventListener("click",function(){if(ui.cmp.length<2){toast("Ajoute au moins 2 produits (bouton ⇄ dans une fiche)");return}openCmp()});
function openCmp(){
  var L=ui.cmp.map(find).filter(Boolean),n=L.length,wins=L.map(function(){return 0});
  var cats={};L.forEach(function(p){cats[p.cat]=1});var mixed=Object.keys(cats).length>1;
  var fields=[],seenK={};L.forEach(function(p){PCAT[p.cat].f.forEach(function(f){if(!seenK[f[0]]&&f[0]!=="type"){seenK[f[0]]=1;fields.push(f)}})});
  function tr(lbl,cells,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+esc(lbl)+'</td>'+cells.map(function(c){return '<td class="'+(c.b?"best":"")+(c.w?" worse":"")+'">'+c.h+'</td>'}).join("")+'</tr>'}
  function bestOf(nums,low){var ok=nums.filter(function(v){return v!=null});if(ok.length<2)return [];var mn=Math.min.apply(null,ok),mx=Math.max.apply(null,ok);if(mn===mx)return [];var t=low?mn:mx;return nums.map(function(v,i){return v===t?i:-1}).filter(function(i){return i>=0})}
  var diff="",same=[],part=[];
  /* essentiel */
  var pr=L.map(function(p){return p.price!=null?+p.price:null}),bp=bestOf(pr,true),minP=Math.min.apply(null,pr.filter(function(x){return x!=null}));
  var ess=tr("Prix",L.map(function(p,i){return {h:p.price!=null?'<b>'+price(p)+'</b>'+(p.price>minP?'<small class="dlt">+'+eur.format(p.price-minP)+'</small>':''):'—',b:bp.indexOf(i)>=0}}));
  bp.forEach(function(i){wins[i]++});
  var lnN=L.map(function(p){return p.ln?p.ln.n:null});if(lnN.some(function(v){return v!=null})){var bl=bestOf(lnN);bl.forEach(function(i){wins[i]++});ess+=tr("Les Numériques",L.map(function(p,i){return {h:p.ln?nf.format(p.ln.n)+'/5'+(p.ln.g?'*':''):'<span class="muted">non testé</span>',b:bl.indexOf(i)>=0}}))}
  var av=L.map(function(p){return p.avis&&p.avis.n>=5?p.avis.note:null});if(av.some(function(v){return v!=null})){var ba=bestOf(av);ba.forEach(function(i){wins[i]++});ess+=tr("Avis clients",L.map(function(p,i){return {h:p.avis&&p.avis.n?'★ '+nf.format(p.avis.note)+' <small class="muted">('+p.avis.n+')</small>':'—',b:ba.indexOf(i)>=0}}))}
  /* critères */
  fields.forEach(function(f){
    var raw=L.map(function(p){var v=(p.specs||{})[f[0]];return v===""?null:v});
    var have=raw.filter(function(v){return v!=null}).length;if(!have)return;
    var txt=raw.map(function(v){var x=specVal(f,v);return x?x.t:null});
    if(have<n){part.push(tr(f[1],txt.map(function(t){return {h:t?esc(t):'<span class="muted">?</span>'}})));return}
    if(txt.every(function(t){return t===txt[0]})){same.push('<span><b>'+esc(f[1])+'</b> '+esc(txt[0])+'</span>');return}
    var best=[],worse=[];
    if(f[2]==="num"){var nums=raw.map(function(v){if(typeof v==="number")return v;var m=String(v).replace(",",".").match(/^(\d+(?:\.\d+)?)\s*[×x]\s*(\d+(?:\.\d+)?)/);return m?m[1]*m[2]:parseFloat(String(v).replace(",","."))}).map(function(v){return isNaN(v)?null:v});best=bestOf(nums,f[4]==="min")}
    else if(f[2]==="bool"){raw.forEach(function(v,i){if(yes(v))best.push(i);else worse.push(i)})}
    best.forEach(function(i){wins[i]++});
    diff+=tr(f[1],txt.map(function(t,i){return {h:esc(t),b:best.indexOf(i)>=0,w:worse.indexOf(i)>=0}}));
  });
  /* qualitatif */
  var qual=tr("Son point unique",L.map(function(p){return {h:esc(p.uniq||(p.args||[])[0]||"—")}}))+
    tr("Pour qui",L.map(function(p){var x=xP(p);return {h:esc(x&&x.pour||"—")}}))+
    tr("Point faible",L.map(function(p){var x=xP(p),c=((x&&x.cons)||[]).filter(function(c){return !/^peu d.avis/i.test(c)})[0]||((p.test||{}).moins||[])[0];return {h:c?esc(c):'<span class="muted">—</span>'}}));
  /* verdict */
  var mx=Math.max.apply(null,wins),leaders=wins.map(function(w,i){return w===mx?i:-1}).filter(function(i){return i>=0});
  var cheap=pr.indexOf(minP),vd=[];
  if(cheap>=0)vd.push('💶 Le moins cher : <b>'+esc(nameOf(L[cheap]))+'</b>');
  if(mx>0&&leaders.length===1)vd.push('🏆 Le plus de critères gagnants : <b>'+esc(nameOf(L[leaders[0]]))+'</b> ('+mx+')');
  else if(mx>0)vd.push('⚖️ Égalité sur les critères gagnants : à départager selon le besoin du client');
  if(cheap>=0&&mx>0&&leaders.length===1&&leaders[0]!==cheap)vd.push('👉 Question à poser : « Les '+eur.format(L[leaders[0]].price-minP)+' d\'écart, ça vaut le coup pour vous si on regarde les lignes vertes ? »');
  var head='<thead><tr><th></th>'+L.map(function(p,i){return '<th><small>'+esc(p.brand||"")+'</small><button type="button" class="cmp-n" data-alt="'+esc(p.id)+'">'+esc(p.model)+'</button><span class="wins">'+wins[i]+' ✓</span><button type="button" class="rm" data-rm="'+esc(p.id)+'">Retirer</button></th>'}).join("")+'</tr></thead>';
  function sr(t){return '<tr class="sr"><td colspan="'+(n+1)+'">'+t+'</td></tr>'}
  var h=(mixed?'<div class="svc">⚠️ Ces produits viennent de rayons différents : seuls quelques critères sont comparables.</div>':'')+
    '<div class="verdict">'+vd.map(function(x){return '<div>'+x+'</div>'}).join("")+'</div>'+
    '<div class="cmp-wrap"><table class="cmp cmp'+n+'">'+head+'<tbody>'+sr("L'essentiel")+ess+(diff?sr("Ce qui les différencie")+diff:'')+sr("Pour bien conseiller")+qual+(part.length?sr("Infos partielles")+part.join(""):'')+'</tbody></table></div>'+
    (same.length?'<h3 class="cmp-h">Pareil sur '+(n>2?'les '+n:'les deux')+'</h3><div class="same">'+same.join("")+'</div>':'')+
    '<p class="foot">En vert : le meilleur sur la ligne (prix et poids : le plus bas). En rouge : l\'équipement manque. « ✓ » = nombre de lignes gagnées. Touche un nom pour ouvrir sa fiche.</p>';
  if(!sheetEl){sheetEl=document.createElement("div");sheetEl.className="sheet";sheetEl.setAttribute("role","dialog");sheetEl.setAttribute("aria-modal","true");sheetEl.setAttribute("aria-label","Comparateur");document.body.appendChild(sheetEl);bindSheet();history.pushState({sheet:1,cat:ui.cat},"")}
  ui.open="__cmp__";sheetList=ui.cmp.slice();
  sheetEl.innerHTML='<div class="sh-bar"><button class="ib" type="button" data-sh="close" aria-label="Fermer">←</button><span class="sh-pos">Comparateur</span></div><div class="sh">'+h+'</div>';
  document.body.style.overflow="hidden";renderTray();
  sheetEl.querySelectorAll("[data-rm]").forEach(function(b){b.addEventListener("click",function(){cmpToggle(b.dataset.rm);if(ui.cmp.length>=2)openCmp();else closeSheet()})});
}

/* ----- mode client ----- */
ui.client=lsGet("rayon-client")===true;document.body.classList.toggle("client",ui.client);$("#client-btn").setAttribute("aria-pressed",String(ui.client));
$("#client-btn").addEventListener("click",function(){ui.client=!ui.client;lsSet("rayon-client",ui.client);document.body.classList.toggle("client",ui.client);this.setAttribute("aria-pressed",String(ui.client));toast(ui.client?"Mode client : objections et notes masquées":"Mode vendeur")});

var tT;function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){el.classList.remove("on")},1800)}

history.replaceState({},"");
load();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});
})();
</script>
